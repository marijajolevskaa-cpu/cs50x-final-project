name: Cypress Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Flask app and wait until it responds
        run: |
          nohup python app.py > flask.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5050/api/health > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 1
          done
          echo "App did not start in time"
          cat flask.log
          exit 1

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Upload screenshots and server log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-debug
          path: |
            cypress/screenshots
            flask.log
          retention-days: 7
